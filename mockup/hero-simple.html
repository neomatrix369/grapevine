<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grapevine, Ask screen (mockup, sample data)</title>
<link rel="stylesheet" href="../kit/design/tokens.css">
<link rel="stylesheet" href="mock.css">
<!-- Every number comes from kit/data/sample via build-mock-data.py -> mock-data.js, through derive() in derive.js. -->
<script src="mock-data.js"></script><script src="derive.js"></script><script src="views.js"></script>
</head>
<body>
<header>
  <span class="brand">Grapevine</span>
  <div class="hright">
    <span class="tag">Sample data</span>
    <span class="muted who small" id="who"></span>
    <button class="btn ghost" id="details-btn" aria-expanded="false" aria-controls="drawer">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 1.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
      <span class="t">Details</span></button>
    <button class="btn" id="play">Play demo</button>
  </div>
</header>

<main>
  <div class="titlebar">
    <h1 id="title">Ask anything about our communities</h1>
    <span class="seg" role="group" aria-label="Mode"><button aria-pressed="true" data-mode="ask">Ask</button><button aria-pressed="false" data-mode="announce">Announce</button></span>
  </div>
  <div class="compose">
    <label for="q" class="sr-only" id="q-label">Your question</label>
    <textarea id="q" rows="2"></textarea>
  </div>
  <p class="confid" id="confid"></p>
  <section class="panel start" id="start" aria-labelledby="sw-h"></section>
  <section class="panel start" id="draft" hidden aria-label="Draft"></section>
</main>

<aside class="drawer" id="drawer" aria-labelledby="drawer-h">
  <div class="dh"><h2 id="drawer-h" tabindex="-1">Details</h2>
    <button class="x" id="drawer-close" aria-label="Close details"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
  <div class="tabs" role="tablist" aria-label="Details">
    <button role="tab" id="t-coverage" aria-controls="p-coverage" aria-selected="true">Coverage</button>
    <button role="tab" id="t-topics" aria-controls="p-topics" aria-selected="false" tabindex="-1">Topics</button>
    <button role="tab" id="t-people" aria-controls="p-people" aria-selected="false" tabindex="-1">People</button>
    <button role="tab" id="t-rules" aria-controls="p-rules" aria-selected="false" tabindex="-1">Rules</button>
    <button role="tab" id="t-me" aria-controls="p-me" aria-selected="false" tabindex="-1">Me</button>
  </div>
  <div class="tp" role="tabpanel" id="p-coverage" aria-labelledby="t-coverage"></div>
  <div class="tp" role="tabpanel" id="p-topics" aria-labelledby="t-topics" hidden></div>
  <div class="tp" role="tabpanel" id="p-people" aria-labelledby="t-people" hidden>
    <div class="tp-h"><span class="label" id="ppl-h"></span><span class="seg" role="group" aria-label="View"><button aria-pressed="true" data-view="ppl-list">List</button><button aria-pressed="false" data-view="ppl-graph">Graph</button></span></div>
    <div id="ppl-list"></div><div id="ppl-graph" hidden></div>
  </div>
  <div class="tp" role="tabpanel" id="p-rules" aria-labelledby="t-rules" hidden></div>
  <div class="tp" role="tabpanel" id="p-me" aria-labelledby="t-me" hidden></div>
</aside>

<script>
const D = window.MOCK, qs = new URLSearchParams(location.search);
const ui = { mode: 'ask', read: false, hidden: [], selected: null, view: qs.get('state') || 'result' };
const $ = id => document.getElementById(id);
function wireDisclosures(root) {
  root.querySelectorAll('[data-disclose]').forEach(b => {
    const closed = b.firstChild.textContent;
    b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open); $(b.getAttribute('aria-controls')).hidden = !open;
      if (b.dataset.labelOpen) b.firstChild.textContent = open ? b.dataset.labelOpen + ' ' : closed;
    });
  });
  root.querySelectorAll('[data-open-tab]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); openDrawer(el.dataset.openTab, el); }));
}
function render() {
  const topic = ui.view === 'ne' ? 't-rag-eval/llm-judge' : 't-rag-eval';
  const v = derive(D, { read: ui.read, hidden: ui.hidden, selected: ui.selected, topic });
  if (!ui.selected) ui.selected = [v.best.name];
  $('who').textContent = v.me.name;
  const ann = ui.mode === 'announce';
  $('title').textContent = ann ? 'Running an event? Paste the announcement' : 'Ask anything about our communities';
  $('q-label').textContent = ann ? 'Your announcement' : 'Your question';
  if (!$('q').dataset.mode || $('q').dataset.mode !== ui.mode + ui.view) {
    $('q').value = ann ? v.announce.draft : ui.view === 'ne' ? 'Is LLM-as-judge reliable enough to trust?' : v.question;
    $('q').rows = ann ? 3 : 2; $('q').dataset.mode = ui.mode + ui.view;
  }
  autosize($('q'));
  $('confid').innerHTML = ann ? '' : V.coverageLine(v); $('confid').hidden = ann;
  $('start').innerHTML = ann ? V.announce(v) : ui.view === 'loading' ? V.loading(v) : ui.view === 'ne' ? V.notEnough(v) : V.startWith(v, ui);
  const chk = $('check'); if (chk) chk.innerHTML = V.check(v);
  $('p-coverage').innerHTML = V.coverage(v);
  $('p-topics').innerHTML = V.topics(v);
  $('ppl-h').textContent = 'On ' + v.topic.label;
  $('ppl-list').innerHTML = V.peopleList(v) + (ui.hidden.length ? `<p class="caption">Hidden by you: ${ui.hidden.length}. <button class="more" data-unhide>Show again</button></p>` : '');
  $('ppl-graph').innerHTML = V.graph(v);
  $('p-rules').innerHTML = V.rules(v);
  $('p-me').innerHTML = V.me(v);
  wireDisclosures(document);
  document.querySelectorAll('#start input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    ui.selected = [...document.querySelectorAll('#start input:checked')].map(x => x.value);
    const vv = derive(D, { read: ui.read, hidden: ui.hidden, selected: ui.selected, topic });
    $('check').innerHTML = V.check(vv); wireDisclosures($('check'));   // only this live region changes
    document.querySelector('[data-copy]').textContent = 'Copy for #' + (ui.selected[0] || vv.best.name);
    document.querySelector('[data-opench]').textContent = 'Open #' + (ui.selected[0] || vv.best.name);
  }));
  document.querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => { ui.read = true; render(); }));
  document.querySelectorAll('[data-hide]').forEach(b => b.addEventListener('click', () => { ui.hidden.push(b.dataset.hide); render(); }));
  document.querySelectorAll('[data-unhide]').forEach(b => b.addEventListener('click', () => { ui.hidden = []; render(); }));
  document.querySelectorAll('[data-draft]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); showDraft(v, b.dataset.draft); }));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    b.parentElement.querySelectorAll('[data-view]').forEach(x => { const on = x === b; x.setAttribute('aria-pressed', on); $(x.dataset.view).hidden = !on; });
  }));
}
function showDraft(v, pid) {
  const d = D.fallbacks.draft_intro.q1, rule = D.rules.find(r => r.rule_id === d.dm_rule);
  const text = pid === d.to ? d.text : `Hi ${v.name(pid).split(' ')[0]}, I read your answers on ${v.topic.label}. Could I ask a follow-up in that thread?`;
  $('draft').hidden = false;
  $('draft').innerHTML = `<div class="ph"><span class="label">Draft to ${esc(v.name(pid))}</span><span class="tag" style="margin-left:auto">Fallback text</span></div>
    <div style="padding:14px 18px"><div class="check" style="margin:0 0 10px"><div class="check-line">${warnIcon}<span>${esc(rule.text)} This draft is a reply in the thread.</span></div></div>
    <label for="draft-text" class="sr-only">Draft text</label><textarea id="draft-text" rows="3" style="width:100%;font:inherit;border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px;background:var(--bg);color:var(--ink)">${esc(text)}</textarea>
    <div class="acts"><button class="btn sm">Copy</button><a class="btn ghost sm" href="#">Open #${esc(v.best.name)}</a><span class="src" style="margin:0" aria-live="polite"></span></div></div>`;
}
// drawer
const drawer = $('drawer'), dBtn = $('details-btn'); let lastTrigger = dBtn;
function openDrawer(tab, trigger) {
  if (tab) selectTab($('t-' + tab), false);
  lastTrigger = trigger || dBtn;
  drawer.classList.add('open'); drawer.removeAttribute('inert'); document.body.classList.add('drawer-open');
  dBtn.setAttribute('aria-expanded', 'true'); $('drawer-h').focus();
}
function closeDrawer() {
  drawer.classList.remove('open'); drawer.setAttribute('inert', ''); document.body.classList.remove('drawer-open');
  dBtn.setAttribute('aria-expanded', 'false'); if (lastTrigger && document.contains(lastTrigger)) lastTrigger.focus(); else dBtn.focus();
}
drawer.setAttribute('inert', '');
dBtn.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer(null, dBtn));
$('drawer-close').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });
const tabs = [...document.querySelectorAll('[role=tab]')];
function selectTab(t, focus) {
  tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; $(x.getAttribute('aria-controls')).hidden = !on; });
  if (focus) t.focus();
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => selectTab(t, true));
  t.addEventListener('keydown', e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d) { e.preventDefault(); selectTab(tabs[(i + d + tabs.length) % tabs.length], true); } });
});
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  ui.mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('draft').hidden = true; render();
}));
if (qs.get('mode') === 'announce') document.querySelector('[data-mode=announce]').click(); else render();
</script>
</body></html>
