<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grapevine mockup screens (sample data)</title>
<link rel="stylesheet" href="../kit/design/tokens.css"><link rel="stylesheet" href="mock.css">
<style>.ix{max-width:1200px;margin:0 auto;padding:32px 24px}.ix h2{margin:28px 0 8px;font-family:var(--font-display);font-weight:400;font-size:var(--text-h2)}.pair{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}.pair img{width:100%;border:1px solid var(--rule);border-radius:var(--radius)}</style>
</head><body><div class="ix"><h1>Grapevine mockup screens</h1>
<p class="src">Sample data only. Live mockup: <a href="grapevine.html">grapevine.html</a>. Layout note: <a href="layout.md">layout.md</a>. Overview: <a href="contact-sheet.png">contact-sheet.png</a>. Each screen at 1280 and 390 px.</p>
<div id="list"></div></div>
<script>
const S = [['ask', 'Land: empty compose, coverage line (demo 1)', '?state=empty'], ['ask-loading', 'Ask: named loading steps (demo 2)', '?state=loading'], ['ask-not-enough-coverage', 'Not enough coverage yet', '?state=ne'],
  ['ask-results', 'Ask results: Already known, Experts to tag, Where to post with cross-post flagged (demo 3 to 5)', ''], ['ask-results-dark', 'Ask results, dark theme', ''],
  ['announce', 'Announce: where allowed, contact first, pick mentors (demo 8)', '?mode=announce'], ['library', 'Library, in place', '?panel=library'], ['experts', 'Experts list, in place', '?panel=experts'],
  ['experts-graph', 'Experts graph (Cognee)', '?panel=graph'], ['my-posts', 'My posts, awaiting replies (demo 6)', '?panel=posts'], ['growth', 'Growth, before the live read', '?panel=growth'],
  ['growth-after-read', 'Growth after reading one channel live (demo 7)', '?panel=growth&read=1'], ['end-card', 'End card with how it was built (demo 9)', '?end=1']];
document.getElementById('list').innerHTML = S.map(([n, t, q]) => `<h2>${t}</h2><p class="src"><a href="grapevine.html${q}">Open live</a></p><div class="pair"><a href="screens/${n}-1280.png"><img src="screens/${n}-1280.png" alt="${t}, 1280 px"></a><a href="screens/${n}-390.png"><img src="screens/${n}-390.png" alt="${t}, 390 px"></a></div>`).join('');
</script></body></html>
